services:
  liorandb:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: liorandb-test
    ports:
      - "4000:4000"
    environment:
      # Persist data to the mounted volume (recommended for Docker)
      LIORANDB_ROOT_PATH: /data
      # Change this in real deployments
      LIORANDB_RPC_TOKEN: change-me
    volumes:
      - ./lioran-data:/data
